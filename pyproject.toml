[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raser"
version = "5.0"
description = "RASER simulation framework"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "RASER Team" }
]
keywords = ["raser", "detector", "simulation", "geant4", "devsim", "root"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: POSIX :: Linux",
  "License :: OSI Approved :: MIT License"
]

dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "h5py",
  "PyYAML",
  "tqdm",
  "numba",
  "joblib",
  "gmsh",
  "psutil",
  "devsim",
  "g4ppyy",
  "pymtl3",
]

[dependency-groups]
test = [
  "import-linter>=2.16",
  "mypy>=2",
  "pytest>=7.4,<8",
  "ruff>=0.15",
]

[project.urls]
Homepage = "https://github.com/raser-team/raser"
Repository = "https://github.com/raser-team/raser"

[project.scripts]
raser = "raser.cli.raser:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raser = [
  "components/**/*",
  "apps/*/*.json",
  "apps/*/components/**/*",
  "apps/bmos/*.cir",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
markers = [
  "root: requires PyROOT",
  "devsim: requires devsim",
  "geant4: requires Geant4/g4ppyy",
  "ngspice: requires ngspice executable",
  "hardware: requires lab hardware",
  "slow: long-running simulation or scan",
]

[tool.importlinter]
root_package = "raser"

# The imports listed under ignore_imports are known and are to go: when one
# is gone its line must go too, or lint-imports fails.

[[tool.importlinter.contracts]]
name = "The chain: a stage may use the stages before it, not those after it"
type = "layers"
layers = [
  "raser.core.readout",
  "raser.core.current",
  "raser.core.deposit",
  "raser.core.field",
  "raser.core.device",
  "raser.core.model",
]

[[tool.importlinter.contracts]]
name = "Nothing below the apps imports an app"
type = "forbidden"
source_modules = [
  "raser.core",
  "raser.components",
  "raser.supports",
  "raser.lifecycle",
]
forbidden_modules = ["raser.apps"]

[[tool.importlinter.contracts]]
name = "The core does not know how it is run"
type = "forbidden"
source_modules = ["raser.core"]
forbidden_modules = ["raser.lifecycle", "raser.cli"]

[[tool.importlinter.contracts]]
name = "No experiment imports another"
type = "independence"
modules = [
  "raser.apps.bmos",
  "raser.bench.cce",
  "raser.apps.cflm",
  "raser.bench.signal",
  "raser.bench.tct",
  "raser.bench.telescope",
  "raser.bench.timeres",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
